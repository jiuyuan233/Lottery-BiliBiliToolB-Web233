# =============================================================================
# nginx 统一入口配置
#   /          -> bili_tool_web:8080   BiliBiliToolPro 面板（扫码登录、日常任务）
#   /lottery/  -> lottery:3000         抽奖状态页（运行日志、手动触发、cookie 状态）
# =============================================================================

# 上游：BiliBiliToolPro Web 面板
upstream bili_tool_web {
    server bili_tool_web:8080;
    keepalive 32;
}

# 上游：LotteryAutoScript 状态页
upstream lottery_status {
    server lottery:3000;
    keepalive 16;
}

server {
    listen       80;
    server_name  _;

    # 体积上限放宽，方便面板上传配置
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # 抽奖状态页：/lottery/  反代到 lottery 容器的 Express 状态服务
    # ------------------------------------------------------------------
    location /lottery/ {
        proxy_pass         http://lottery_status/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # 其余全部交给 BiliBiliToolPro 面板（含 Blazor 静态资源、_blazor、API）
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://bili_tool_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Blazor 长连接
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
