# =============================================================================
# 动态抽奖 —— LotteryAutoScript (Node.js)
# 上游：https://github.com/shanmiteko/LotteryAutoScript
# -----------------------------------------------------------------------------
# 触发方式：
#   1) schedule 类人类作息（北京时间，cron 用 UTC，北京=UTC+8）
#      08:33 检查中奖
#      10:33 参与抽奖（上午，timeout 20分钟≈转发26条）
#      12:13 参与抽奖（中午，timeout 20分钟≈转发26条）
#      19:33 参与抽奖（晚上，timeout 20分钟≈转发26条）
#      22:03 检查中奖
#      周日 23:03 清理
#      → 三次 start 间隔均超过 1 小时，发够 26 条就休息
#   2) workflow_dispatch 手动选命令
# cookie 从仓库 Secrets 注入（BILI_COOKIE），扫一次码两边共用。
# =============================================================================
name: 动态抽奖

on:
  schedule:
    - cron: '33 0 * * *'     # 北京 08:33 — 起床检查中奖（错峰避整点）
    - cron: '33 2 * * *'     # 北京 10:33 — 上午参与抽奖（错峰，timeout 20分钟≈26条）
    - cron: '13 4 * * *'     # 北京 12:13 — 午休参与抽奖（错峰，timeout 20分钟≈26条）
    - cron: '33 11 * * *'    # 北京 19:33 — 晚饭后参与抽奖（错峰，timeout 20分钟≈26条）
    - cron: '3 14 * * *'     # 北京 22:03 — 睡前检查中奖（错峰）
    - cron: '3 15 * * 0'     # 周日北京 23:03 — 清理动态/关注（错峰）
  workflow_dispatch:
    inputs:
      cmd:
        description: '抽奖命令'
        type: choice
        default: start
        options:
          - start
          - check
          - clear
          - login
          - acount

jobs:
  run:
    runs-on: ubuntu-latest
    # 不设 timeout-minutes，用 GitHub 默认 6 小时（最大值），避免任务被杀死
    steps:
      # --- 根据触发方式决定命令 ---
      - name: 决定命令
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ inputs.cmd }}"
          else
            case "${{ github.event.schedule }}" in
              "33 0 * * *")  CMD=check;;
              "33 2 * * *")  CMD=start;;
              "13 4 * * *")  CMD=start;;
              "33 11 * * *") CMD=start;;
              "3 14 * * *")  CMD=check;;
              "3 15 * * 0")  CMD=clear;;
              *)             CMD=check;;
            esac
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "::notice::本次执行命令: $CMD"

      # --- 检查 cookie 是否配置 ---
      - name: 检查 cookie
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          if [ -z "$BILI_COOKIE" ]; then
            echo "::error::未配置 BILI_COOKIE Secret。请到仓库 Settings → Secrets and variables → Actions → New repository secret，添加 BILI_COOKIE（值为 B 站 cookie 字符串）"
            exit 1
          fi
          echo "cookie 已就绪（长度 ${#BILI_COOKIE}）"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # --- 克隆上游 LotteryAutoScript（保留更新渠道：每次跑都拉最新）---
      - name: 克隆 LotteryAutoScript 上游
        run: git clone --depth 1 https://github.com/shanmiteko/LotteryAutoScript.git lottery-src

      # --- 注入 cookie（从 Secrets）与类人类作息配置 ---
      - name: 注入 cookie 与配置
        env:
          BILI_COOKIE:   ${{ secrets.BILI_COOKIE }}
          BILI_COOKIE_2: ${{ secrets.BILI_COOKIE_2 }}
          BILI_COOKIE_3: ${{ secrets.BILI_COOKIE_3 }}
        run: |
          cp lottery/my_config.example.js lottery-src/my_config.js
          node lottery/inject-cookie.js

      - name: 安装依赖
        run: cd lottery-src && npm install --omit=dev

      # --- 执行（start 命令用 timeout 限制 20 分钟≈转发 26 条，发够就停）---
      - name: 执行 ${{ steps.decide.outputs.cmd }}
        id: execute
        continue-on-error: true
        run: |
          cd lottery-src
          CMD=${{ steps.decide.outputs.cmd }}
          if [ "$CMD" = "start" ]; then
            echo "::notice::start 模式：timeout 1200s（20分钟）≈ 转发 26 条后自动停止"
            timeout 1200 node main.js start 2>&1 | tee /tmp/task-output.log
            echo "::notice::start 执行结束（可能因 timeout 正常停止）"
          else
            node main.js "$CMD" 2>&1 | tee /tmp/task-output.log
          fi

      # --- 飞书通知（无论成功失败都推送，含任务专属汇报模板）---
      - name: 飞书通知
        if: always()
        env:
          FS_WEBHOOK:    ${{ secrets.FS_WEBHOOK }}
          NOTIFY_TITLE:  '动态抽奖'
          NOTIFY_TASK:   ${{ steps.decide.outputs.cmd }}
          NOTIFY_STATUS: ${{ steps.execute.outcome }}
        run: |
          export NOTIFY_OUTPUT=$(cat /tmp/task-output.log 2>/dev/null | tail -200)
          node lottery/notify-feishu.js
